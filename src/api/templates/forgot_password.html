<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recuperar Contraseña</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f0f0f0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }

      .recovery-container {
        background-color: #fff;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        width: 350px;
        text-align: center;
      }

      .recovery-container h1 {
        margin-bottom: 20px;
        color: #333;
      }

      .recovery-container label {
        display: block;
        text-align: left;
        margin-bottom: 5px;
        font-weight: bold;
        color: #555;
      }

      .recovery-container input {
        width: 100%;
        padding: 10px;
        margin-bottom: 20px;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
      }

      .recovery-container button {
        width: 100%;
        padding: 10px;
        background-color: #ff69b4;
        border: none;
        border-radius: 4px;
        color: #fff;
        font-size: 16px;
        cursor: pointer;
      }

      .recovery-container button:hover {
        background-color: #f03297;
      }

      .message {
        margin-bottom: 20px;
        padding: 10px;
        border-radius: 4px;
        color: #fff;
      }

      .message.error {
        background-color: #e74c3c;
      }

      .message.success {
        background-color: #2ecc71;
      }
    </style>
  </head>
  <body>
    <div class="recovery-container">
      <h1>Recuperar Contraseña</h1>
      <!-- Display error or success message based on context -->
      {% if error %}
      <div class="message error">{{ error }}</div>
      {% elif success %}
      <div class="message success">{{ success }}</div>
      {% endif %}
      <form method="POST" action="/api/forgot_password">
        <label for="email">Correo Electrónico:</label>
        <input type="email" id="email" name="email" required />
        <button type="submit">Enviar</button>
      </form>
    </div>
  </body>
</html>
