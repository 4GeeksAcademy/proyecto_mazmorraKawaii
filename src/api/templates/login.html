<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login ADMI - Mazmorra Kawaii</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f0f0f0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }

      .login-container {
        background-color: #fff;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        width: 350px; /* Ajusta el ancho del contenedor */
        text-align: center; /* Centra el contenido horizontalmente */
      }

      .login-container h2 {
        margin-bottom: 20px;
      }

      .login-container input {
        width: 100%;
        padding: 10px;
        margin: 10px 0;
        border: 1px solid #ccc;
        border-radius: 4px;
      }

      .login-container button {
        width: 100%;
        padding: 10px;
        background-color: #ff69b4;
        border: none;
        border-radius: 4px;
        color: #fff;
        font-size: 16px;
        cursor: pointer;
      }

      .login-container button:hover {
        background-color: #f03297;
      }

      .forgot-password {
        margin-top: 10px;
        text-align: center;
        color: #800080;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <h2>Login ADMI - Mazmorra Kawaii</h2>
      <form action="/api/login" method="post">
      <input
        type="email"
        name="email"
        placeholder="Correo Electrónico"
        required
      />
      <input
        type="password"
        name="password"
        placeholder="Contraseña"
        required
      />
      <button type="submit">Iniciar Sesión</button>
      </form>
      <a class="forgot-password" href="#">¿Olvidaste tu contraseña?</a>
      {% if error %}
        <p style="color: red;">{{ error }}</p>
      {% endif %}
    </div>
    <script>
      document.querySelector('.forgot-password').addEventListener('click', function (event) {
        event.preventDefault();
        window.location.href = '/api/forgot_password';
      });
    </script>
  </body>
</html>
