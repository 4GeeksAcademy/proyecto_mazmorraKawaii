<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cambiar Contraseña</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f0f0f0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }

      .change-password-container {
        background-color: #fff;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        width: 350px;
        text-align: center;
      }

      .change-password-container h1 {
        margin-bottom: 20px;
        color: #333;
      }

      .change-password-container label {
        display: block;
        text-align: left;
        margin-bottom: 5px;
        font-weight: bold;
        color: #555;
      }

      .change-password-container input {
        width: 100%;
        padding: 10px;
        margin-bottom: 20px;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
      }

      .change-password-container button {
        width: 100%;
        padding: 10px;
        background-color: #ff69b4;
        border: none;
        border-radius: 4px;
        color: #fff;
        font-size: 16px;
        cursor: pointer;
      }

      .change-password-container button:hover {
        background-color: #f03297;
      }
    </style>
  </head>

  <body>
    <div class="change-password-container">
      <h1>Cambiar Contraseña</h1>
      <form method="POST" action="/api/reset_password" onsubmit="redirectUser(event)">
        <label for="new-password">Nueva Contraseña:</label>
        <input type="password" id="new-password" name="new_password" required />

        <label for="confirm-password">Confirmar Nueva Contraseña:</label>
        <input type="password" id="confirm-password" name="confirm_password" required />

        <input type="hidden" name="email" value="{{email}}" />

        <button type="submit">Cambiar Contraseña</button>
      </form>
    </div>
    <script>
      function redirectUser(event) {
        event.preventDefault();
        const form = event.target;
        const formData = new FormData(form);

        fetch(form.action, {
          method: form.method,
          body: formData,
        })
          .then(response => {
            if (response.ok) {
              window.location.href = 'http://localhost:3001/api/login';
            } else {
              alert('Error al cambiar la contraseña.');
            }
          })
          .catch(error => {
            console.error('Error:', error);
            alert('Error al cambiar la contraseña.');
          });
      }
    </script>
  </body>

</html>
